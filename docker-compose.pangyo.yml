services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ticketing
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 필요}
      - POSTGRES_DB=ticketing
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    # *** (중요) bitnami/kafka:3.7 -> apache/kafka:3.7.0로 교체 (2026-08-14) ***
    # bitnami/kafka는 2025-08-28부로 Docker Hub 무료 카탈로그에서 내려가서
    # docker.io/bitnamilegacy/kafka로 이전됨(업데이트/보안패치 중단, 예고 없이
    # 완전히 사라질 수 있음). 대회 제출물이라 평가 시점에 이미지가 갑자기
    # 없어지는 리스크를 피하기 위해 Apache Kafka 프로젝트가 직접 배포하는
    # 공식 이미지로 전환. 환경변수 체계가 KAFKA_CFG_* -> KAFKA_*로 바뀌고,
    # CLUSTER_ID(KRaft 클러스터 식별자, 고정 UUID)가 새로 필요해짐.
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      # *** 대전 PoP가 붙기 위해 반드시 필요한 포트 (2026-08-14 추가) ***
      # 이게 없으면 Kafka는 판교 도커 네트워크 안에서만 접근 가능해서
      # 대전 PoP가 요청을 발행할 방법이 아예 없다.
      - "13092:13092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      # *** 리스너를 INTERNAL/EXTERNAL 둘로 나눈 이유 (중요) ***
      # Kafka 클라이언트는 최초 접속 후 브로커가 "광고(advertise)"하는 주소로
      # 다시 연결한다. 그래서 광고 주소가 'kafka:9092' 하나뿐이면, 대전에서
      # 10.246.246.19로 접속에 성공하더라도 브로커가 "나한테 오려면 kafka:9092로 와"
      # 라고 알려주고, 대전은 그 이름을 풀 수 없어서 결국 실패한다.
      #  - INTERNAL(9092): 판교 도커 네트워크 안의 central/pop-pangyo/kafka-exporter용
      #  - EXTERNAL(13092): 판교 밖(대전 PoP)에서 붙는 용도. 반드시 실제 도달 가능한
      #                     호스트 IP를 광고해야 한다.
      # *** EXTERNAL 광고 주소를 IP가 아니라 '이름'으로 둔 이유 (2026-08-14) ***
      # 대전 PoP는 판교 사설망에 직접 갈 수 없고, 대전 호스트에 띄운 socat 중계기를
      # 거쳐서만 닿는다. 그런데 브로커가 광고 주소를 10.246.246.19로 알려주면
      # 대전 컨테이너가 그 주소로 직접 가려다 실패한다.
      # 그래서 이름으로 광고하고, 대전 쪽 compose에서 extra_hosts로 그 이름을
      # 자기 호스트(172.17.0.1 = socat 중계기)로 매핑한다.
      # 판교 내부 컨테이너들은 전부 INTERNAL(kafka:9092)을 쓰므로 영향이 없다.
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:13092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://kafka-external:13092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      # 대전 PoP가 각자 고유 group_id로 seat-status를 구독하므로 파티션을 넉넉히.
      - KAFKA_NUM_PARTITIONS=3
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # AOF(everysec): 재시작해도 최대 1초치만 잃는다. 수집창/확정 상태를 담는 저장소라 켠다.
    # noeviction: 메모리가 차도 키를 몰래 지우지 않고 쓰기를 실패시킨다(공정성 상태 유실 방지).
    # 호스트에 포트를 열지 않는다: 같은 compose 네트워크의 central 만 접근한다.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data

  central:
    build: ./central
    container_name: central
    restart: unless-stopped
    ports:
      - "10001:8080"
    environment:
      # *** 판정을 여러 코어에 분산  [PARPROC_V1] ***
      # 판정이 단일 프로세스=단일 코어에 묶여 ~2.5k/s 가 천장이었다(실측 CPU 100%=1코어).
      # uvicorn 워커를 파티션 수만큼 띄우면 각 워커가 파티션 1개를 맡아 여러 코어를 쓴다.
      # key=seat_id 파티셔닝이라 한 좌석은 늘 같은 워커로만 가 상태가 안 꼬인다.
      - UVICORN_WORKERS=3
      # [REDIS_V1] 수집창 상태 저장소 선택: memory(기존) | redis. 기본은 memory 라 동작이 바뀌지 않는다.
      - STATE_BACKEND=${STATE_BACKEND:-memory}
      # [Step 2] DB 앞단 Redis Stream 버퍼: 1 이면 켠다 (STATE_BACKEND=redis 와 함께 사용). 기본 0 = 꺼짐.
      - REDIS_DB_BUFFER=${REDIS_DB_BUFFER:-0}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_JUDGE_CONSUMERS=1
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom_multiproc
      # *** 풀 크기: 워커 N배가 되므로 Postgres max_connections(100)를 넘지 않게 낮춘다 ***
      # 3워커 × (판정16 + 인증4) = 60 < 100. 판정 DB 쓰기는 창 닫힐 때 좌석당 1회라 넉넉.
      - AUTH_POOL_MAX_SIZE=4
      - KAFKA_BROKER=kafka:9092
      - DATABASE_URL=postgresql://ticketing:${POSTGRES_PASSWORD}@postgres:5432/ticketing
      # DB 커넥션 안전장치. 풀은 여기 적힌 수를 절대 넘지 않으므로 커넥션이
      # 폭주하는 일은 없고, 부하가 걸리면 대기 시간이 길어지는 형태로 나타난다.
      # 대기가 무한이 되지 않도록 획득/실행 타임아웃을 함께 건다.
      - DB_POOL_MAX_SIZE=16
      - DB_ACQUIRE_TIMEOUT=5
      - DB_COMMAND_TIMEOUT=10
      # print() 출력이 Docker 로그에 즉시 보이게 한다. 이게 없으면 파이썬이
      # 출력을 버퍼에 모아두는 바람에 "Postgres 연결 성공" 같은 로그가 한참 뒤에
      # 나오거나 아예 안 보여서, 실제로는 정상인데 실패한 것처럼 오해하게 된다.
      - PYTHONUNBUFFERED=1
      # [시연용 임시] 수집창 고정. 하한=상한이라 자동 산정이 무시된다. 끝나면 이 두 줄 삭제.
      - WINDOW_MIN_MS=3000
      - WINDOW_MAX_MS=3000
      # 좌석당 경쟁이 20건을 넘으면 경쟁자 기록이 잘려서 상향  [시연용]
      - ALL_REQUESTS_KEEP=40
    depends_on:
      - kafka
      - postgres
      - redis

  pop-pangyo:
    build: ./pop
    container_name: pop-pangyo
    restart: unless-stopped
    environment:
      - HEARTBEAT_INTERVAL_SEC=1
      # 워커 수와 지표 합산 디렉터리  [WORKERS_V1]
      - UVICORN_WORKERS=4
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prom_multiproc
      - POP_ID=pop-pangyo
      # 1차 봇 필터 동작 모드: off | monitor | enforce
      #   monitor = 판정만 하고 통과시킴. 부하 테스트(curl)가 그대로 돌아간다.
      #   시연에서 차단을 보여줄 때만 enforce 로 바꾼다.
      - BOT_FILTER_MODE=monitor
      - CENTRAL_URL=http://central:8080
      - KAFKA_BROKER=kafka:9092
      # 호스트가 내려준 chrony 오프셋 파일의 컨테이너 안 경로 (아래 volumes 참고).
      - CLOCK_OFFSET_FILE=/clock/tracking.csv
      - PYTHONUNBUFFERED=1
    volumes:
      # *** 호스트 chrony의 클럭 오프셋을 읽어오는 통로 (2026-08-14) ***
      # 컨테이너의 localhost는 호스트가 아니라서 chronyd에 직접 못 닿는다. 그래서
      # 호스트의 pop-clock-offset.service가 5초마다 `chronyc -c tracking` 결과를
      # /run/pop-clock/tracking.csv에 원자적으로 쓰고, 여기서 읽기전용으로 마운트한다.
      # chrony.conf 변경도, 이미지에 chrony 패키지 추가도, 네트워크 노출도 필요 없다.
      #
      # *** 설치 필요 *** PoP를 띄우는 모든 호스트에서 (판교/대전 둘 다):
      #   sudo install -m 755 scripts/chrony-offset-writer.sh /usr/local/bin/
      #   sudo install -m 644 scripts/pop-clock-offset.service /etc/systemd/system/
      #   sudo systemctl daemon-reload && sudo systemctl enable --now pop-clock-offset
      # 이게 안 돌면 PoP는 오프셋을 못 읽어 보정값 0으로(=보정 없이) 동작한다.
      - /run/pop-clock:/clock:ro
    depends_on:
      - central
      - kafka

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "13198:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # *** 정적 파일을 nginx가 직접 서빙하기 위한 마운트 (2026-08-14 추가) ***
      # PoP 컨테이너 안에도 같은 파일이 구워져 있지만, 브라우저 트래픽은 여기서
      # 끊기고 PoP까지 가지 않는다. 볼륨이라 파일을 고치면 재빌드 없이 즉시 반영된다.
      - ./pop/frontend:/usr/share/nginx/html:ro
    depends_on:
      - pop-pangyo

  # ---------------------------------------------------------------------------
  # 관측(Observability) 스택
  # ---------------------------------------------------------------------------

  # Postgres 자체의 부하(커넥션 수, TPS, 캐시 히트율 등)를 Prometheus가 읽을 수 있는
  # 형식으로 번역해주는 중계기. DB에 읽기 전용으로 붙어 pg_stat_* 뷰를 긁어간다.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://ticketing:${POSTGRES_PASSWORD}@postgres:5432/ticketing?sslmode=disable
    depends_on:
      - postgres

  # Kafka 브로커에 직접 붙어서 토픽별 누적 메시지 수와 컨슈머 그룹 lag을 노출한다.
  # *** consumer lag이 핵심 *** — 중앙서버가 PoP 발행 속도를 못 따라가면 여기서 먼저 보인다.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      - kafka

  # *** 대전 PoP 지표를 받기 위한 중계 창구 (2026-08-14 추가) ***
  # Prometheus는 pull 방식이라 대상 서버에 자기가 직접 접속해서 지표를 긁어온다.
  # 그런데 판교 -> 대전 방향은 열려 있지 않아서 대전 PoP를 직접 긁을 수가 없다.
  # (지금까지의 모든 통신은 전부 대전이 먼저 연결을 여는 방향이었다.)
  #
  # 그래서 방향을 뒤집는다. 대전이 자기 지표를 여기로 밀어 넣고(push),
  # Prometheus는 판교 안에 있는 이 창구만 긁으면 된다. 대전이 먼저 연결을 여는
  # 구조라 지금 뚫려 있는 경로를 그대로 쓸 수 있다.
  pushgateway:
    image: prom/pushgateway:v1.8.0
    container_name: pushgateway
    restart: unless-stopped
    ports:
      # 대전에서 중계기를 통해 여기로 밀어 넣는다.
      - "13091:9091"

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      # KOREN이 허용한 10000~15000 범위 안에서 배정
      - "13090:9090"
    volumes:
      - ./monitoring/pangyo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - central
      - pop-pangyo

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "13300:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?.env 에 GRAFANA_ADMIN_PASSWORD 필요}
      # 데모/심사 편의상 로그인 없이 바로 대시보드가 보이게 한다.
      # *** 주의 (기술 부채): 실제 운영에서는 반드시 꺼야 하는 설정. ***
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
      # *** 중요 *** Grafana는 기본적으로 5초보다 짧은 새로고침을 거부한다.
      # 이 값을 안 낮추면 대시보드에 refresh=1s를 써놔도 조용히 5s로 되돌려버린다.
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      # 접속하자마자 우리 대시보드가 첫 화면으로 뜨게 한다.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/koren-pangyo-dashboard.json
    volumes:
      - ./monitoring/pangyo/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/pangyo/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/pangyo/koren-pangyo-dashboard.json:/etc/grafana/provisioning/dashboards/koren-pangyo-dashboard.json:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redisdata:
  pgdata:
  promdata:
  grafanadata:
