# 판교 nginx 설정. 대전은 nginx/daejeon.conf (PoP 이름과 central 주소 세 줄만 다르다).
# PoP 엣지 nginx 설정 (판교/대전 공통 템플릿)
#
# 설계 의도:
#  1) 정적 파일(HTML/CSS/이미지)은 nginx가 디스크에서 직접 응답한다.
#     -> PoP 컨테이너(uvicorn)까지 요청이 가지 않으므로 엣지에서 트래픽이 끊긴다.
#        티켓팅처럼 같은 페이지를 수만 명이 동시에 받아가는 상황에서 이 차이가 크다.
#  2) 동적 API만 PoP 컨테이너로 프록시한다.
#  3) 판정에 쓰이는 요청은 반드시 PoP를 거쳐야 하므로 절대 캐시하지 않는다.
#
# *** proxy_pass에 변수를 쓰는 이유 (중요) ***
# proxy_pass에 호스트명을 고정 문자열로 적으면 nginx가 기동 시점에 딱 한 번만
# DNS를 조회해서 IP를 캐싱한다. 그래서 docker compose up --build로 PoP 컨테이너가
# 재생성되어 IP가 바뀌면 nginx는 죽은 옛 IP로 계속 요청을 보내 502가 난다.
# proxy_pass에 변수를 끼우면 nginx가 요청마다 resolver로 다시 조회하는 동작으로
# 바뀌어서, 재빌드 후에도 nginx를 손대지 않아도 자동으로 따라간다.

resolver 127.0.0.11 valid=10s ipv6=off;

# PoP 연결 풀  [KEEPALIVE_V1]
# 변수 방식은 연결 재사용이 안 되어 요청마다 TCP 를 새로 맺는다.
# 대가: nginx 기동 시 이 이름을 해석하므로 PoP 를 먼저 올려야 한다.
# [MICROCACHE_V1] 1초 마이크로캐시 + IP별 속도 제한 (내부 대역은 제한 제외)
proxy_cache_path /var/cache/nginx/doon levels=1:2 keys_zone=doon_micro:5m max_size=20m inactive=10s use_temp_path=off;
geo $limit_exempt { default 0; 127.0.0.1 1; 10.0.0.0/8 1; 172.16.0.0/12 1; 192.168.0.0/16 1; }
map $limit_exempt $limit_key { 0 $binary_remote_addr; 1 ""; }
limit_req_zone $limit_key zone=doon_req:10m rate=50r/s;
limit_req_log_level warn;
upstream doon_pop {
    server pop-pangyo:8000;
    keepalive 64;
    keepalive_requests 100000;
    keepalive_timeout 75s;
}

server {
    listen 80;
    server_name _;
    # [MACRO3_LIVE] 판교 서버 안(도커 대역·localhost)에서 보낸 요청만 X-Forwarded-For 를 접속 IP 로 믿는다.
    # 실험 회차의 사람 시뮬레이터·봇이 각자 다른 IP 로 보이게 하려는 것. 외부 사용자는 대전 PoP 로 들어온다.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # 이 PoP가 프록시할 대상. 판교/대전이 이 값만 다르다.
    set $pop_upstream "http://pop-pangyo:8000";

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ---------------------------------------------------------------------
    # 동적 API -> PoP 컨테이너로 프록시
    # 정규식 location은 정의된 순서대로 검사되므로, 정적 파일 규칙보다 반드시 먼저 온다.
    # ---------------------------------------------------------------------
    # -------------------------------------------------------------------
    # 인증 -> 중앙서버  [NGINXAUTH_V1]
    # -------------------------------------------------------------------
    # ^~ 를 쓰는 이유: 접두사 location 이 매치되면 아래 정규식 location 들을
    # 아예 검사하지 않는다. /auth/login 이 정적 파일 폴백으로 새는 것을 막는다.
    # (/auth-status 는 접두사 '/auth/' 와 다르므로 그대로 PoP 로 간다.)
    location ^~ /auth/ {
        set $central_upstream http://central:8080;
        proxy_pass $central_upstream$request_uri;
        proxy_http_version 1.1;

        # *** 로그인 IP 기록에 쓰이는 헤더 ***
        # 중앙의 _client_ip() 는 X-Forwarded-For 의 "마지막" 값을 실제 IP 로 쓴다.
        # $proxy_add_x_forwarded_for 가 뒤에 $remote_addr 를 붙여주기 때문이다.
        # 이 줄이 빠지면 sessions.login_ip 가 전부 nginx 컨테이너 IP 가 되어
        # "한 IP 에서 계정 수십 개" 같은 신호를 영영 볼 수 없게 된다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 인증 응답은 절대 캐시하면 안 된다 (토큰이 남의 브라우저로 갈 수 있다).
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # bcrypt 가 약 100ms 걸리고, 대전은 릴레이를 한 번 더 탄다.
        # 좌석 판정 경로(5s)보다 넉넉하게 준다. 느려도 되는 경로이기 때문이다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # [MICROCACHE_V1] 모든 사용자에게 같은 응답이라 1초만 저장 (판정 경로 아님)
    location = /seats-overview {
        proxy_pass http://doon_pop;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_cache doon_micro;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-cache" always;
    }
    location = /seat-count {
        proxy_pass http://doon_pop;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_cache doon_micro;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-cache" always;
    }
    # [MICROCACHE_V1] 좌석 클릭: IP별 속도 제한 (캐시 안 함)
    location = /seat-request {
        limit_req zone=doon_req burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://doon_pop;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ ^/(seat-request|seat-status|seats-overview|seat-count|booking-entry|payment|requests|entries|health|clock-offset|bot-filter|auth-status|metrics)(/|$) {
        proxy_pass http://doon_pop;   # [KEEPALIVE_V1]
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # *** 봇 탐지에 쓰이는 실제 접속자 IP를 PoP에 전달 ***
        # pop_server.py가 detection-log 토픽에 담는 client_ip가 이 헤더에서 나온다.
        # 이 줄이 빠지면 모든 요청의 IP가 nginx 컨테이너 IP로 찍혀서 탐지가 무의미해진다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 판정용 요청은 절대 캐시하면 안 된다 (좌석 상태가 매 순간 바뀌므로).
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------------
    # 정적 파일 -> nginx가 디스크에서 직접 응답 (PoP까지 안 감)
    # ---------------------------------------------------------------------

    # 포스터 이미지: 거의 안 바뀌므로 길게 캐시
    location /img/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # CSS 등: 배포 중 수정될 수 있으니 짧게
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML 문서: 캐시하지 않고 매번 최신을 주되, 응답 자체는 nginx가 처리
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
