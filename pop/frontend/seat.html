<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좌석 선택 - DOON</title>
<style>
/* index.html 과 마찬가지로 style.css 를 쓰지 않는다.
   두 화면이 같은 CSS 파일을 공유하면 한쪽을 고칠 때마다 다른 쪽이 같이 바뀌어서,
   시연 직전에 예상 못 한 곳이 깨진다. 각 화면이 자기 스타일을 들고 있게 한다. */
* { box-sizing: border-box; }
body {
  margin: 0; background: #fafafa; color: #222;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* 상단: index 와 같은 정체성. 파란 띠 없이 한 문장으로. */
.brandbar { background: #fff; border-bottom: 1px solid #eee; }
.brandbar .wrap {
  padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; gap: 16px;
}
.brandline { font-size: 14px; color: #777; letter-spacing: -0.2px; }
.brandline b { font-size: 24px; font-weight: 700; color: #111; letter-spacing: -0.5px; margin-right: 8px; }
.util { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #777; }
.util span, .util svg { cursor: pointer; }
.util span:hover { color: #333; }

.crumb { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #999; padding: 14px 0 12px; }
.badge { background: #F5821F; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 2px; }

.layout { display: flex; gap: 18px; align-items: flex-start; padding-bottom: 60px; }

.venue {
  flex: 1; min-width: 0; background: #fff;
  border: 1px solid #e8e8e8; border-radius: 8px; padding: 22px 16px 26px;
}
.showtitle { text-align: center; font-size: 16px; font-weight: 700; color: #111; margin-bottom: 16px; letter-spacing: -0.4px; }
.stage-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
.stage-bar {
  background: #8b8b8b; color: #fff; font-size: 13px; font-weight: 700;
  padding: 10px 0; width: 40%; text-align: center; border-radius: 0 0 26px 26px;
  letter-spacing: 1px;
}
.floor-label { text-align: center; font-size: 12px; color: #999; margin-bottom: 8px; }
.floor-divider { border-top: 1px solid #eee; margin: 22px 0 16px; }

/* *** 구역이 절대 겹치지 않게 하는 규칙 ***
   회전한 사각형은 화면상 차지하는 폭이 원래보다 넓어진다. 가장 넓은 구역(10열)
   기준으로 9도 회전 시 약 10px 늘어나므로, 구역 사이 간격을 그보다 넉넉한
   22px 로 둔다. 이전에 회전각 13도 + 간격 5px 조합에서 겹침이 발생했다. */
.zone-row { display: flex; justify-content: center; align-items: flex-start; gap: 20px; }
.zone-seat-block { flex-shrink: 0; }
.zone-seat-label { font-size: 11px; font-weight: 700; text-align: center; margin-bottom: 3px; color: #444; }
.zone-seat-grid { border: 1px solid #b0b0b0; padding: 3px; background: #fff; display: inline-block; }
.mini-seat-row { display: flex; gap: 2px; margin-bottom: 2px; }
.mini-seat-row:last-child { margin-bottom: 0; }
.mini-seat {
  width: 11px; height: 11px; border: 1px solid #ccc; background: #fff;
  cursor: pointer; transition: background 0.12s;
}
.mini-seat.available:hover { background: #FFE3C9; border-color: #F5821F; }
/* 선택됨: index 의 예매하기 버튼과 같은 주황. 두 화면이 이어져 보이게 하는 핵심. */
.mini-seat.selected { background: #F5821F; border-color: #F5821F; }
/* 예약중(빨강)과 판매됨(회색)은 그대로 둔다 — 부하 시연에서
   "빨갛게 물들었다가 회색으로 굳는" 장면이 이 두 색으로 만들어진다. */
.mini-seat.pending { background: #d64027; border-color: #d64027; cursor: not-allowed; }
.mini-seat.unavailable { background: #cfcfcf; border-color: #cfcfcf; cursor: not-allowed; }

.legend { display: flex; justify-content: center; gap: 18px; font-size: 12px; color: #555; margin-top: 24px; flex-wrap: wrap; }
.legend .box { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; margin-right: 5px; }
.legend .box.available { border: 1px solid #bbb; background: #fff; }
.legend .box.selected { background: #F5821F; }
.legend .box.pending { background: #d64027; }
.legend .box.unavailable { background: #cfcfcf; }

.side { width: 210px; flex-shrink: 0; }
.card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.card-title { font-size: 12px; font-weight: 700; color: #111; margin-bottom: 9px; }

.calhead { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #333; margin-bottom: 8px; }
.calhead .nav { color: #ccc; cursor: default; }
.calhead .ym { font-weight: 700; }
.caldow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 10px; color: #aaa; text-align: center; margin-bottom: 3px; }
.caldow .sun { color: #e08a8a; }
.caldow .sat { color: #8aa0e0; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 11px; text-align: center; }
.calgrid div { padding: 3px 0; border-radius: 3px; color: #ddd; }
.calgrid div.today { background: #F5821F; color: #fff; font-weight: 700; }
.calgrid div.tomorrow { border: 1px solid #F5821F; color: #B3560A; }

.slot { font-size: 11.5px; padding: 6px 8px; border-radius: 3px; display: flex; justify-content: space-between; }
.slot.on { border: 1px solid #F5821F; background: #FFF6EE; color: #B3560A; margin-bottom: 6px; }
.slot.off { border: 1px solid #e6e6e6; color: #999; }

.sum { font-size: 11.5px; color: #666; }
.sum .line { display: flex; justify-content: space-between; margin-bottom: 5px; }
.sum .line:last-child { margin-bottom: 0; }
.sum .val { color: #111; font-weight: 700; }
.sum .val.pick { color: #F5821F; }

.book {
  background: #F5821F; color: #fff; border: 0; width: 100%;
  padding: 12px 0; font-size: 14px; font-weight: 700; border-radius: 3px;
  cursor: pointer; font-family: inherit; letter-spacing: -0.3px;
}
.book:hover { background: #DE7115; }
.book:disabled { background: #ccc; cursor: default; }

/* 판정 결과: 사이드바가 좁으므로 긴 UUID 가 넘치지 않게 강제로 줄바꿈한다. */
.result {
  background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
  padding: 11px; margin-top: 10px; font-size: 11px; color: #444;
  line-height: 1.6; word-break: break-all;
}
.result .status-text { color: #F5821F; margin-top: 6px; font-weight: 700; }

@media (max-width: 1000px) {
  .layout { flex-direction: column; }
  .side { width: 100%; }
}

/* 접속 지역 패널: 사용자가 지금 어느 PoP에 붙어 있는지 보여준다.
   /clock-offset 이 pop_id 와 시계 오차를 함께 주므로 새 API 가 필요 없다.
   판교와 대전 브라우저를 나란히 열면 이 패널만 다르게 보이는 것이
   "지역 분산이 실재한다"는 가장 직관적인 증거가 된다. */
.leftpanel { width: 180px; flex-shrink: 0; }
.pop-name { font-size: 19px; font-weight: 700; color: #F5821F; letter-spacing: -0.4px; margin-bottom: 14px; }
.pop-cap { font-size: 11px; color: #888; margin-bottom: 2px; }
.flow { display: flex; align-items: flex-start; gap: 10px; }
.flow .rail { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
.flow .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #ccc; background: #fff; }
.flow .dot.on { background: #F5821F; border-color: #F5821F; }
.flow .bar { width: 1.5px; height: 26px; background: #eee; }
.flow .bar.on { background: #eadfd5; }
.flow .txt { flex: 1; min-width: 0; font-size: 11.5px; }
.flow .step { height: 35px; }
.flow .step:last-child { height: auto; }
.flow .t1 { color: #555; }
.flow .t1.on { color: #B3560A; font-weight: 700; }
.flow .t2 { color: #aaa; font-size: 10px; }
.pop-foot { border-top: 1px solid #eee; margin-top: 12px; padding-top: 10px; font-size: 11px; color: #666; }
.pop-foot .line { display: flex; justify-content: space-between; margin-bottom: 5px; }
.pop-foot .line:last-child { margin-bottom: 0; }
.pop-foot .v { color: #111; font-weight: 700; }
@media (max-width: 1000px) { .leftpanel { width: 100%; } }
</style>
</head>
<body>

<div class="brandbar">
  <div class="wrap">
    <div class="brandline"><b>DOON</b>티켓팅에 공정을 담다. with KOREN</div>
    <div class="util">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="crumb">
    <span>콘서트 &gt; 국내가수 &gt; 좌석 선택</span>
    <span class="badge">자동 예매 방지</span>
  </div>

  <div class="layout">
      <div class="leftpanel">
        <div class="card">
          <div class="pop-cap">내 접속 지역</div>
          <div class="pop-name" id="popName">확인 중...</div>

          <div class="flow">
            <div class="rail">
              <div class="dot on"></div><div class="bar on"></div>
              <div class="dot"></div><div class="bar"></div>
              <div class="dot"></div>
            </div>
            <div class="txt">
              <div class="step"><div class="t1 on" id="popStep">-</div><div class="t2">여기서 시각이 찍힘</div></div>
              <div class="step"><div class="t1">Kafka 전송</div><div class="t2">seat-requests</div></div>
              <div class="step"><div class="t1">판교 중앙서버</div><div class="t2">공정 판정</div></div>
            </div>
          </div>

          <div class="pop-foot">
            <div class="line"><span>시계 오차</span><span class="v" id="popOffset">-</span></div>
            <div class="line"><span>기준 시각</span><span class="v">공통 NTP</span></div>
          </div>
        </div>
      </div>
    <div class="venue">
      <div class="showtitle" id="showTitle">DOON LIVE TOUR 2026</div>

      <div class="stage-wrap"><div class="stage-bar">STAGE</div></div>

      <div class="floor-label">1F</div>
      <div class="zone-row" id="zoneRow1F"></div>

      <div class="floor-divider"></div>

      <div class="floor-label">2F</div>
      <div class="zone-row" id="zoneRow2F"></div>

      <div class="legend">
        <span><span class="box available"></span>선택 가능</span>
        <span><span class="box selected"></span>선택됨</span>
        <span><span class="box pending"></span>예약중 (판정 대기)</span>
        <span><span class="box unavailable"></span>이미 판매됨</span>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="calhead">
          <span class="nav">&lsaquo;</span>
          <span class="ym" id="calYm">--</span>
          <span class="nav">&rsaquo;</span>
        </div>
        <div class="caldow">
          <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
        </div>
        <div class="calgrid" id="calGrid"></div>
      </div>

      <div class="card">
        <div class="slot on"><span id="slot1">1회 19:00</span><span id="slotSeats">608석</span></div>
        <div class="slot off"><span>2회 21:00</span><span>매진</span></div>
      </div>

      <div class="card sum">
        <div class="line"><span>선택 좌석</span><span class="val pick" id="pickTxt">-</span></div>
        <div class="line"><span>잔여석</span><span class="val" id="remainTxt">-</span></div>
      </div>

      <button id="reserveBtn" class="book" disabled>좌석을 선택하세요</button>
      <div id="reserveResult" class="result" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
// 구역별 설정: 열 개수, 회전 각도(스테이지를 향하도록), 층
// *** 좌석 ID 규칙(A-1-1 ~ J-8-10, 총 608석)은 절대 바꾸지 않는다 ***
// 부하 테스트 스크립트와 중앙서버 DB가 이 ID를 그대로 쓰기 때문에,
// 여기서 열 수나 행 수를 바꾸면 시연 전체가 어긋난다.
// 회전각은 13도에서 9도로 낮췄다 — 구역이 서로 겹치는 것을 막기 위해서다.
const ZONES = {
  A: { cols: 6,  rot: 9,  floor: '1F' },
  B: { cols: 8,  rot: 4,  floor: '1F' },
  C: { cols: 10, rot: 0,  floor: '1F' },
  D: { cols: 8,  rot: -4, floor: '1F' },
  E: { cols: 6,  rot: -9, floor: '1F' },
  F: { cols: 6,  rot: 9,  floor: '2F' },
  G: { cols: 8,  rot: 4,  floor: '2F' },
  H: { cols: 10, rot: 0,  floor: '2F' },
  I: { cols: 8,  rot: -4, floor: '2F' },
  J: { cols: 6,  rot: -9, floor: '2F' },
};
const ROWS = 8;
const marginTopByOrder = [-6, 4, 8, 4, -6];

const reserveBtn = document.getElementById('reserveBtn');
const reserveResult = document.getElementById('reserveResult');
const pickTxt = document.getElementById('pickTxt');
const remainTxt = document.getElementById('remainTxt');
const slotSeats = document.getElementById('slotSeats');

let selectedSeatId = null;
let myPendingSeatId = null;
let pollTimer = null;

function toKST(isoUtcString) {
  return new Date(isoUtcString).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
}

function seatId(zoneLetter, row, col) {
  return zoneLetter + '-' + row + '-' + col;
}

// --- 공연 정보: index 와 같은 규칙으로 오늘 날짜를 쓴다 ---
(function () {
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const p = n => (n < 10 ? '0' + n : '' + n);
  const now = new Date();
  document.getElementById('showTitle').textContent =
    'DOON LIVE TOUR 2026  ·  ' + p(now.getMonth() + 1) + '.' + p(now.getDate()) +
    '(' + DOW[now.getDay()] + ') 19:00';

  // 달력: 이번 달을 그리고 오늘은 채움, 내일은 테두리로 표시한다.
  const y = now.getFullYear(), m = now.getMonth();
  document.getElementById('calYm').textContent = y + '. ' + p(m + 1);
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();
  const grid = document.getElementById('calGrid');
  for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
  for (let d = 1; d <= last; d++) {
    const cell = document.createElement('div');
    cell.textContent = d;
    if (d === now.getDate()) cell.className = 'today';
    else if (d === now.getDate() + 1 && d <= last) cell.className = 'tomorrow';
    grid.appendChild(cell);
  }
})();

// --- 좌석배치도 렌더링 ---
function renderVenue() {
  const row1F = document.getElementById('zoneRow1F');
  const row2F = document.getElementById('zoneRow2F');
  ['A', 'B', 'C', 'D', 'E'].forEach((letter, i) => buildZoneSeatBlock(row1F, letter, marginTopByOrder[i]));
  ['F', 'G', 'H', 'I', 'J'].forEach((letter, i) => buildZoneSeatBlock(row2F, letter, marginTopByOrder[i]));
}

function buildZoneSeatBlock(container, letter, marginTop) {
  const zd = ZONES[letter];

  const wrap = document.createElement('div');
  wrap.className = 'zone-seat-block';
  wrap.style.marginTop = marginTop + 'px';
  if (zd.rot !== 0) wrap.style.transform = 'rotate(' + zd.rot + 'deg)';

  const label = document.createElement('div');
  label.className = 'zone-seat-label';
  label.textContent = letter;
  wrap.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'zone-seat-grid';

  for (let r = 1; r <= ROWS; r++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'mini-seat-row';
    for (let c = 1; c <= zd.cols; c++) {
      const id = seatId(letter, r, c);
      const seatDiv = document.createElement('div');
      seatDiv.className = 'mini-seat available';
      seatDiv.dataset.seatId = id;
      seatDiv.title = id;
      seatDiv.addEventListener('click', () => onSeatClick(seatDiv, id));
      rowDiv.appendChild(seatDiv);
    }
    grid.appendChild(rowDiv);
  }

  wrap.appendChild(grid);
  container.appendChild(wrap);
}

function onSeatClick(seatDiv, id) {
  if (seatDiv.classList.contains('unavailable') || seatDiv.classList.contains('pending')) return;

  const wasSelected = seatDiv.classList.contains('selected');

  document.querySelectorAll('.mini-seat.selected').forEach(s => {
    s.classList.remove('selected');
    s.classList.add('available');
  });

  if (wasSelected) {
    seatDiv.classList.remove('selected');
    seatDiv.classList.add('available');
    selectedSeatId = null;
    pickTxt.textContent = '-';
    reserveBtn.disabled = true;
    reserveBtn.textContent = '좌석을 선택하세요';
  } else {
    seatDiv.classList.remove('available');
    seatDiv.classList.add('selected');
    selectedSeatId = id;
    pickTxt.textContent = id;
    reserveBtn.disabled = false;
    reserveBtn.textContent = id + ' 예약하기';
  }

  reserveResult.style.display = 'none';
}

// --- 실시간 좌석 상태 반영 ---
async function refreshSeatOverview() {
  try {
    const res = await fetch('/seats-overview');
    const overviewData = await res.json();

    document.querySelectorAll('.mini-seat[data-seat-id]').forEach(seatDiv => {
      const id = seatDiv.dataset.seatId;
      if (id === selectedSeatId || id === myPendingSeatId) return;

      const status = overviewData[id];
      seatDiv.classList.remove('available', 'pending', 'unavailable');
      if (status === 'confirmed') seatDiv.classList.add('unavailable');
      else if (status === 'pending') seatDiv.classList.add('pending');
      else seatDiv.classList.add('available');
    });
  } catch (err) {
    // 조회 실패는 조용히 무시 (다음 주기에 다시 시도)
  }
}

// 잔여석 요약. PoP 에 1초 TTL 캐시가 있어 사용자가 많아도 중앙 왕복은 초당 1회로 묶인다.
async function refreshSeatCount() {
  try {
    const res = await fetch('/seat-count');
    const d = await res.json();
    if (d.remaining === null || d.remaining === undefined) return;
    remainTxt.textContent = d.remaining + ' / ' + d.total;
    slotSeats.textContent = d.remaining + '석';
  } catch (err) {}
}

setInterval(refreshSeatOverview, 1500);
setInterval(refreshSeatCount, 3000);

// --- 예약하기: 이 순간 PoP 가 타임스탬프를 찍고 central 로 전달한다 ---
reserveBtn.addEventListener('click', async () => {
  if (!selectedSeatId) return;

  const id = selectedSeatId;
  myPendingSeatId = id;
  reserveBtn.disabled = true;
  reserveBtn.textContent = '요청 처리 중...';

  try {
    // 토큰이 있으면 Authorization 헤더로 실어보낸다.  [FRONTAUTH_V1]
    // *** 없어도 요청은 나간다 ***
    // PoP 는 optional 모드라 토큰 없는 요청도 통과시킨다. 로그인 여부로 예매를
    // 막는 것은 화면의 역할이고, PoP 는 "누구인지 확인만" 한다. 이렇게 나눠야
    // 부하 테스트(curl, 토큰 없음)가 그대로 돌아간다.
    var _doonHeaders = { 'Content-Type': 'application/json' };
    var _doonTok = (window.doonAuth && window.doonAuth.token()) || null;
    if (_doonTok) _doonHeaders['Authorization'] = 'Bearer ' + _doonTok;
    const res = await fetch('/seat-request', {
      method: 'POST',
      headers: _doonHeaders,
      body: JSON.stringify({ seat_id: id }),
    });
    const data = await res.json();

    reserveResult.style.display = 'block';
    reserveResult.innerHTML =
      '<div>좌석 <b>' + data.seat_id + '</b> 요청이 <b>' + data.pop_id + '</b>에 도착</div>' +
      '<div>도착(KST): <b>' + toKST(data.pop_arrival_timestamp) + '</b></div>' +
      '<div>요청 ID: ' + data.request_id + '</div>' +
      '<div class="status-text">중앙 서버에서 판정 중...</div>';

    pollForResult(id, data.request_id);
  } catch (err) {
    reserveResult.style.display = 'block';
    reserveResult.innerHTML = '요청 전송 중 오류가 발생했습니다. PoP 서버 연결을 확인해주세요.';
    reserveBtn.disabled = false;
    reserveBtn.textContent = id + ' 예약하기';
    myPendingSeatId = null;
  }
});

async function pollForResult(id, myRequestId) {
  try {
    const res = await fetch('/seat-status/' + id);
    const data = await res.json();

    if (data.status === 'pending') {
      const statusLine = reserveResult.querySelector('.status-text');
      if (statusLine) statusLine.textContent = '판정 중... 지금까지 ' + data.requests_so_far + '건 경쟁';
      pollTimer = setTimeout(() => pollForResult(id, myRequestId), 500);
      return;
    }

    if (data.status === 'confirmed') {
      myPendingSeatId = null;
      if (data.winner_request_id === myRequestId) {
        reserveResult.innerHTML =
          '<div style="color:#2f7d4a;font-weight:700;">축하합니다! 좌석 ' + id + ' 획득</div>' +
          '<div class="status-text">결제 페이지로 이동합니다...</div>';
        // 수집 회차(?every=)에서는 결제로 넘어가지 않고 다음 회차를 기다린다  [ROUNDS_V1]
        if (!new URLSearchParams(location.search).get('every')) setTimeout(() => {
          window.location.href = '/payment.html?seat_id=' + id + '&request_id=' + myRequestId;
        }, 1200);
      } else {
        reserveResult.innerHTML =
          '<div style="color:#a12b2b;font-weight:700;">이 좌석은 이미 예약되었습니다.</div>' +
          '<div class="status-text">다른 좌석을 선택해주세요.</div>';
        const seatDiv = document.querySelector('.mini-seat[data-seat-id="' + id + '"]');
        if (seatDiv) {
          seatDiv.classList.remove('selected');
          seatDiv.classList.add('unavailable');
        }
        selectedSeatId = null;
        pickTxt.textContent = '-';
        reserveBtn.disabled = true;
        reserveBtn.textContent = '좌석을 선택하세요';
      }
      return;
    }

    pollTimer = setTimeout(() => pollForResult(id, myRequestId), 500);
  } catch (err) {
    reserveResult.innerHTML = '판정 결과 확인 중 오류가 발생했습니다.';
    reserveBtn.disabled = false;
    reserveBtn.textContent = id + ' 예약하기';
    myPendingSeatId = null;
  }
}

renderVenue();
refreshSeatOverview();
refreshSeatCount();

// 접속 지역 표시: /clock-offset 한 번이면 pop_id 와 시계 오차가 같이 온다.
// 5초마다 갱신해서 시계 오차가 살아 움직이는 값이라는 걸 보여준다.
async function refreshPopInfo() {
  try {
    const res = await fetch('/clock-offset');
    const d = await res.json();
    const label = d.pop_id === 'pop-daejeon' ? '대전 PoP'
                : d.pop_id === 'pop-pangyo'  ? '판교 PoP'
                : d.pop_id;
    document.getElementById('popName').textContent = label;
    document.getElementById('popStep').textContent = label;
    const ms = Number(d.clock_offset_ms);
    document.getElementById('popOffset').textContent =
      (ms >= 0 ? '+' : '') + ms.toFixed(3) + ' ms';
  } catch (err) {
    document.getElementById('popName').textContent = '연결 확인 필요';
  }
}
refreshPopInfo();
setInterval(refreshPopInfo, 5000);

</script>

<!-- 수집 회차용 오픈 카운트다운  [ROUNDS_V1]
     seat.html?every=2 로 열면 2분마다 정각(기기 시계 기준)에 '오픈'한다.
     오픈 전에는 좌석만 고를 수 있고 예약하기 버튼은 잠긴다. 오픈 후 30초 동안 열린다.
     봇은 이 잠금을 무시하고 API 를 바로 친다 — 실제 예매 사이트와 같은 구조다.
     bots/rounds.py 가 같은 규칙(every 분의 배수)으로 회차 시각을 기록한다. -->
<script>
(function () {
  var every = +new URLSearchParams(location.search).get('every');
  if (!every) return;
  var period = every * 60000, wasOpen = false;
  var bar = document.createElement('div');
  bar.style.cssText = 'position:sticky;top:0;z-index:999;padding:12px;text-align:center;' +
                      'font:700 22px sans-serif;color:#fff;background:#222';
  document.body.prepend(bar);
  setInterval(function () {
    var now = Date.now(), since = now % period, open = since < 30000;
    bar.textContent = open ? '오픈! ' + (since / 1000).toFixed(1) + '초 경과'
                           : '다음 오픈까지 ' + Math.ceil((period - since) / 1000) + '초';
    bar.style.background = open ? '#c62828' : '#222';
    if (!open) reserveBtn.disabled = true;
    else if (!wasOpen && selectedSeatId) reserveBtn.disabled = false;
    wasOpen = open;
  }, 50);
})();
</script>

<!-- 로그인 상태 표시  [FRONTAUTH_V1] -->
<script>
(function () {
  // 토큰 보관은 localStorage 를 쓴다.
  // 서버가 세션을 조회하지 않는 무상태 검증이라, 이 토큰 자체가 신원 증명이다.
  function tok() {
    var t = localStorage.getItem('doon_token');
    var exp = parseInt(localStorage.getItem('doon_expires_at') || '0', 10);
    // 만료된 토큰을 들고 있으면 PoP 가 expired 로 판정한다.
    // 화면 단에서 미리 정리해 "로그인한 줄 알았는데 신원이 안 붙는" 상태를 막는다.
    if (t && exp && Date.now() > exp) { logout(true); return null; }
    return t;
  }
  function logout(silent) {
    ['doon_token','doon_account_id','doon_session_id','doon_email',
     'doon_device_fp','doon_expires_at'].forEach(function (k) {
      localStorage.removeItem(k);
    });
    if (!silent) location.reload();
  }
  // 다른 화면에서도 쓸 수 있게 전역으로 노출한다.
  window.doonAuth = {
    token: tok,
    logout: logout,
    email: function () { return localStorage.getItem('doon_email') || ''; },
    require: function (returnTo) {
      if (tok()) return true;
      location.href = '/login.html?returnTo=' + encodeURIComponent(returnTo || location.pathname);
      return false;
    },
  };

  // 상단 유틸 영역에 로그인 상태를 그린다. 없으면 조용히 넘어간다.
  var util = document.querySelector('.util');
  if (!util) return;
  var box = document.createElement('span');
  box.style.cssText = 'display:inline-flex;align-items:center;gap:8px;font-size:13px;';
  if (tok()) {
    var who = document.createElement('span');
    who.style.cssText = 'color:#B3560A;font-weight:700;';
    who.textContent = window.doonAuth.email();
    var out = document.createElement('a');
    out.href = '#'; out.textContent = '로그아웃';
    out.style.cssText = 'color:#999;text-decoration:none;';
    out.addEventListener('click', function (e) { e.preventDefault(); logout(false); });
    box.appendChild(who); box.appendChild(out);
  } else {
    var a = document.createElement('a');
    a.href = '/login.html?returnTo=' + encodeURIComponent(location.pathname);
    a.textContent = '로그인';
    a.style.cssText = 'color:#777;text-decoration:none;';
    box.appendChild(a);
  }
  util.appendChild(box);
})();
</script>
